onboarding = false

# "terminal" hereda la paleta ANSI del terminal host (Ghostty),
# así herdr adopta automáticamente la paleta Lich King / Frostmourne.
[theme]
name = "terminal"
auto_switch = false

# El estado del agente en el sidebar se pinta con estos tokens:
#   blocked -> red · working -> yellow · done -> teal · idle -> green
#
# Con name = "terminal" cada token sale de la paleta ANSI de Ghostty, y en
# Frostmourne el amarillo (ANSI 3) no es amarillo: es #A9D4E8, un celeste
# pálido. Así "working" quedaba a un paso del cyan de "done" (#3FE0E0), del
# verde de "idle" (#5FD9B0) y hasta del texto normal (#D6E4F0) — los cuatro
# fríos, imposible distinguirlos de reojo.
#
# El ámbar es el único token que se pisa: `yellow` fuera de este estado solo
# aparece en el popup de settings. Es el mismo YELLOW que usa sketchybar.
[theme.custom]
yellow = "#E3B341"

# PENDIENTE — descomentar cuando herdr pase de 0.8.0 en el canal stable.
#
# Con "dots" (el default) blocked, working y done comparten el MISMO glifo ●:
# lo unico que los separa es el color. "symbols" les da forma propia —
# × bloqueado · ◐ trabajando · ✓ terminado · ○ inactivo — asi el estado se lee
# de reojo, sin depender de distinguir cyan de verde.
#
# En 0.8.0 la clave todavia no existe: herdr responde "unknown config key
# ui.status_indicators; ignoring key" y `herdr config check` deja de dar limpio.
# La feature esta en el changelog de la proxima version (#2260), o sea solo en
# builds del canal preview.
#
# [ui]
# status_indicators = "symbols"

[keys]
split_vertical = "prefix+\\"

# Buscador de sesiones de Claude Code (plugin local, ver plugins/claude-sessions).
# prefix+s ya es settings, asi que va con shift. El plugin hay que linkearlo una
# vez por maquina — sin eso, la tecla no hace nada:
#   herdr plugin link ~/.config/herdr/plugins/claude-sessions
[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "dotfiles.claude-sessions.open"
description = "Buscar sesiones de Claude Code"
