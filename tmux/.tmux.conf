# ~/.tmux.conf - Configuración de tmux

# Configuración básica
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm*:Tc"

# Cambiar prefix a Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Recarga de configuración
bind r source-file ~/.tmux.conf \; display "Configuración recargada!"

# Navegación de paneles con vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar paneles
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# División de ventanas más intuitiva
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Crear nueva ventana en el directorio actual
bind c new-window -c "#{pane_current_path}"

# Habilitar modo mouse
set -g mouse on

# No delay para escape key press
set -sg escape-time 0

# Aumentar límite de historial
set -g history-limit 50000

# Empezar ventanas y paneles en 1, no 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Copy mode con vim bindings
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Configuración de colores
set -g status-bg black
set -g status-fg white
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-right "#[fg=cyan]%d %b %R"
set -g status-interval 60

# Destacar ventana activa
setw -g window-status-current-style fg=white,bg=red,bright