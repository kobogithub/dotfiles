# ~/.tmux.conf - Configuración personalizada de tmux

# Configuración básica
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm*:Tc"

# Posicionar barra de estado arriba
set -g status-position top

# Cambiar prefix a Ctrl-a (como solicitas)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Recarga de configuración
bind r source-file ~/.tmux.conf \; display "¡Configuración de tmux recargada! 🔄"

# Divisiones de ventana personalizadas (como solicitas)
bind | split-window -h -c "#{pane_current_path}"    # Ctrl+a + | = división vertical
bind - split-window -v -c "#{pane_current_path}"    # Ctrl+a + - = división horizontal
unbind '"'
unbind %

# Navegación de paneles con vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navegación alternativa con flechas
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Redimensionar paneles
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Redimensionar con Alt+Shift+flechas
bind -n M-S-Left resize-pane -L 2
bind -n M-S-Right resize-pane -R 2
bind -n M-S-Up resize-pane -U 1
bind -n M-S-Down resize-pane -D 1

# Crear nueva ventana en el directorio actual
bind c new-window -c "#{pane_current_path}"

# Navegación rápida entre ventanas
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Habilitar modo mouse
set -g mouse on

# No delay para escape key press
set -sg escape-time 0

# Aumentar límite de historial
set -g history-limit 50000

# Empezar ventanas y paneles en 1, no 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Copy mode con vim bindings
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Integración con portapapeles (macOS: pbcopy, Linux/WSL2: xclip o clip.exe)
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "cat | /mnt/c/Windows/System32/clip.exe 2>/dev/null || xclip -selection clipboard"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "cat | /mnt/c/Windows/System32/clip.exe 2>/dev/null || xclip -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "cat | /mnt/c/Windows/System32/clip.exe 2>/dev/null || xclip -selection clipboard"
}

# Pegar desde clipboard
bind P paste-buffer

# Sincronizar paneles (útil para ejecutar comandos en múltiples paneles)
bind S set-window-option synchronize-panes\; display-message "Sincronización: #{?synchronize-panes,ON,OFF}"

# Alternar entre el panel actual y el último
bind a last-pane

# Cerrar panel con confirmación
bind x confirm-before -p "¿Cerrar panel? (y/n)" kill-pane

# Cerrar ventana con confirmación
bind X confirm-before -p "¿Cerrar ventana? (y/n)" kill-window

# ===== CATPPUCCIN THEME CONFIGURATION =====
# Configure Catppuccin flavor (latte, frappe, macchiato, mocha)
set -g @catppuccin_flavor "frappe"

# Configure window status style
set -g @catppuccin_window_status_style "rounded"

# ===== PALETA PERSONALIZADA "TALIGENT" =====
# Los archivos de tema de Catppuccin definen los colores con `set -ogq`
# (-o = solo si NO está ya definido). Al fijar aquí las variables @thm_*
# ANTES de cargar el plugin, estas tienen prioridad y reemplazan a "frappe"
# sin necesidad de tocar los archivos del plugin.

# Fondo y texto principales
set -g @thm_bg "#0A0809"
set -g @thm_fg "#f8f5f0"

# Acentos (paleta Taligent: naranja / ámbar / verde / gris cálido)
set -g @thm_rosewater "#f4a91c"
set -g @thm_flamingo  "#f4a91c"
set -g @thm_pink      "#EB7522"
set -g @thm_mauve     "#EB7522"
set -g @thm_red       "#EB7522"
set -g @thm_maroon    "#EB7522"
set -g @thm_peach     "#f4a91c"
set -g @thm_yellow    "#f4a91c"
set -g @thm_green     "#56B36A"
set -g @thm_teal      "#56B36A"
set -g @thm_sky       "#A8A29A"
set -g @thm_sapphire  "#f7b728"
set -g @thm_blue      "#A8A29A"
set -g @thm_lavender  "#B8B2A8"

# Superficies y overlays (degradado oscuro cálido derivado de #0A0809 / #141215)
set -g @thm_subtext_1 "#D8D2C8"
set -g @thm_subtext_0 "#B8B2A8"
set -g @thm_overlay_2 "#8A7F81"
set -g @thm_overlay_1 "#6A5F61"
set -g @thm_overlay_0 "#4A4244"
set -g @thm_surface_2 "#2E2829"
set -g @thm_surface_1 "#211D1F"
set -g @thm_surface_0 "#141215"
set -g @thm_mantle    "#100E0F"
set -g @thm_crust     "#0A0809"

# Load Catppuccin theme
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ===== STATUS LINE CONFIGURATION =====
# Make the status line pretty and add some modules
set -g status-right-length 150
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g status-interval 15

# ===== COLOR OVERRIDES (mantener tu estilo personalizado) =====
# Los colores se manejan automáticamente por Catppuccin
# pero puedes personalizar mensajes específicos aquí si lo deseas

# Sobrescribir el color de fondo de la barra de estado (paleta Taligent)
set -g status-style bg="#0A0809"

# ===== PLUGINS ADICIONALES =====
# Additional plugins can be loaded here if needed
# Note: tmux-cpu and tmux-battery plugins were removed as they are not used in the status bar configuration

# Configuración adicional para mejor experiencia
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Display de información de panel
set -g display-panes-time 2000
set -g display-panes-colour "#2E2829"
set -g display-panes-active-colour "#EB7522"

# ===== TÍTULOS DE PANEL (identificar proyecto/tema por pane) =====
# Muestra una barra en el borde superior de cada panel.
# Por defecto usa el nombre del directorio del proyecto (basename de la ruta);
# si fijás un título manual con Ctrl+a + T, ese tiene prioridad.
set -g pane-border-status top
set -g pane-border-format " #[fg=#EB7522]#{pane_index}#[fg=#f8f5f0] #{?#{!=:#{pane_title},#H},#{pane_title},#{b:pane_current_path}} "

# Colores del borde (Taligent: activo en naranja, inactivos en gris cálido)
set -g pane-border-style fg="#4A4244"
set -g pane-active-border-style fg="#EB7522"

# Ctrl+a + T = ponerle un título/tema manual al panel actual
bind T command-prompt -p "Título del panel:" "select-pane -T '%%'"

# Configuración de sesión
set -g detach-on-destroy off