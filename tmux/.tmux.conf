# ~/.tmux.conf - Configuración personalizada de tmux

# Configuración básica
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm*:Tc"

# Cambiar prefix a Ctrl-a (como solicitas)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Recarga de configuración
bind r source-file ~/.tmux.conf \; display "¡Configuración de tmux recargada! 🔄"

# Divisiones de ventana personalizadas (como solicitas)
bind | split-window -h -c "#{pane_current_path}"    # Ctrl+a + | = división vertical
bind - split-window -v -c "#{pane_current_path}"    # Ctrl+a + - = división horizontal
unbind '"'
unbind %

# Navegación de paneles con vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navegación alternativa con flechas
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Redimensionar paneles
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Redimensionar con Alt+Shift+flechas
bind -n M-S-Left resize-pane -L 2
bind -n M-S-Right resize-pane -R 2
bind -n M-S-Up resize-pane -U 1
bind -n M-S-Down resize-pane -D 1

# Crear nueva ventana en el directorio actual
bind c new-window -c "#{pane_current_path}"

# Navegación rápida entre ventanas
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Habilitar modo mouse
set -g mouse on

# No delay para escape key press
set -sg escape-time 0

# Aumentar límite de historial
set -g history-limit 50000

# Empezar ventanas y paneles en 1, no 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Copy mode con vim bindings
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pegar desde clipboard
bind P paste-buffer

# Sincronizar paneles (útil para ejecutar comandos en múltiples paneles)
bind S set-window-option synchronize-panes\; display-message "Sincronización: #{?synchronize-panes,ON,OFF}"

# Alternar entre el panel actual y el último
bind a last-pane

# Cerrar panel con confirmación
bind x confirm-before -p "¿Cerrar panel? (y/n)" kill-pane

# Cerrar ventana con confirmación
bind X confirm-before -p "¿Cerrar ventana? (y/n)" kill-window

# Configuración de colores y estilo
set -g status-bg black
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 50
set -g status-left "#[fg=green,bold]❐ #S #[fg=white]• "
set -g status-right "#[fg=cyan]%d %b %Y #[fg=green]• #[fg=cyan]%H:%M "
set -g status-interval 60

# Destacar ventana activa
setw -g window-status-current-style fg=black,bg=green,bold
setw -g window-status-current-format " #I: #W "

# Ventanas normales
setw -g window-status-style fg=cyan,bg=black
setw -g window-status-format " #I: #W "

# Configuración de paneles
set -g pane-border-style fg=black
set -g pane-active-border-style fg=green

# Mensajes
set -g message-style fg=white,bg=black,bold

# Configuración adicional para mejor experiencia
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Display de información de panel
set -g display-panes-time 2000
set -g display-panes-colour cyan
set -g display-panes-active-colour green

# Configuración de sesión
set -g detach-on-destroy off