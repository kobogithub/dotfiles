# ~/.config/starship.toml - Configuración de Starship

# Configuración general
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

# Configuración del directorio
[directory]
style = "blue"
truncation_length = 4
truncate_to_repo = false

# Configuración de Git
[git_branch]
symbol = "🌱 "
format = "on [$symbol$branch]($style) "
style = "bright-green"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-yellow"

# Configuración del prompt
[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](green)"

# Duración del comando
[cmd_duration]
format = "⏱️  [$duration]($style) "
style = "yellow"
show_milliseconds = true
min_time = 500

# Usuario
[username]
style_user = "green"
style_root = "red"
format = "[$user]($style) "
disabled = false
show_always = true

# Hostname
[hostname]
ssh_only = false
format = "on [$hostname](bold red) "
disabled = false

# Python
[python]
symbol = "🐍 "
format = 'via [${symbol}python (${version} )(\($virtualenv\) )]($style)'
style = "bright-blue"

# Configuración de tiempo
[time]
disabled = false
format = '🕙[\[ $time \]]($style) '
time_format = "%T"
style = "bright-white"

# Node.js
[nodejs]
symbol = "⬢ "
format = "via [$symbol($version )]($style)"
style = "bright-green"

# Rust
[rust]
symbol = "🦀 "
format = "via [$symbol($version )]($style)"
style = "bright-red"

# Package version
[package]
format = "via [📦 $version](208)"
disabled = false