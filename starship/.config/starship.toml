# ~/.config/starship.toml - Configuración personalizada de Starship

# Tiempo máximo (ms) que Starship espera por comandos externos como
# `python --version`. El shim de pyenv es lento, así que subimos el
# default (500) para evitar el timeout.
command_timeout = 1000

# Configuración general del prompt
format = """
[┌─❄ ](bold #3FE0E0)$username$hostname$directory$git_branch$git_status$git_state$aws$kubernetes$docker_context$package$python$nodejs$rust$cmd_duration
[└─ ](bold #3FE0E0)$character"""

# Configuración del directorio
[directory]
style = "bold #6FC5F0"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

# Configuración de Git
[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold #9D7CD8"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold #C75450"
conflicted = "⚡"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = "✓"
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#A9D4E8"

# Configuración del prompt principal
[character]
success_symbol = "[❯](bold #3FE0E0)"
error_symbol = "[❯](bold #E06C75)"
vicmd_symbol = "[❮](bold #A9D4E8)"

# Usuario y hostname
[username]
style_user = "bold #4FA8D8"
style_root = "bold #C75450"
format = "[$user]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "@[$hostname](bold #6FC5F0) "
disabled = false

# Duración del comando
[cmd_duration]
format = "took [$duration]($style) "
style = "bold #A9D4E8"
show_milliseconds = false
min_time = 2000

# Lenguajes y herramientas
[python]
symbol = "🐍 "
format = 'via [$symbol$pyenv_prefix($version) ]($style)'
style = "bold yellow"
# Evita el shim lento de pyenv al resolver la versión para el prompt.
python_binary = ["python3"]

[nodejs]
symbol = "⬢ "
format = "via [$symbol($version )]($style)"
style = "bold green"

[rust]
symbol = "🦀 "
format = "via [$symbol($version )]($style)"
style = "bold red"

# Package version
[package]
format = "pkg [$version]($style) "
style = "bold magenta"
disabled = false

# AWS
[aws]
format = 'on [$symbol($profile )]($style)'
style = "bold blue"
symbol = "☁️  "

# Docker
[docker_context]
format = "via [$symbol$context]($style) "
style = "blue bold"
symbol = "🐳 "

# Kubernetes
[kubernetes]
format = 'on [⎈ $context\($namespace\)](bold #9D7CD8) '
disabled = false

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:us-east-1:777555387664:cluster/lycsa"
context_alias = "lycsa"

[[kubernetes.contexts]]
context_pattern = "docker-desktop"
context_alias = "local"

# Tiempo (opcional, descomenta si quieres ver la hora)
# [time]
# disabled = false
# format = '🕙[$time]($style) '
# time_format = "%R"
# style = "bold white"

# Configuración de estado de batería (para laptops)
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

# Variables de entorno
[env_var]
variable = "SHELL"
default = "unknown shell"
format = "with [$env_value]($style) "
disabled = true
