# ~/.config/starship.toml - Configuración personalizada de Starship

# Configuración general del prompt
format = """
[┌─ ](bold green)$username$hostname$directory$git_branch$git_status$git_state$aws$kubernetes$docker_context$package$python$nodejs$rust$cmd_duration
[└─ ](bold green)$character"""

# Configuración del directorio
[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

# Configuración de Git
[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "⚡"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = "✓"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-yellow"

# Configuración del prompt principal
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# Usuario y hostname
[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "@[$hostname](bold yellow) "
disabled = false

# Duración del comando
[cmd_duration]
format = "took [$duration]($style) "
style = "bold yellow"
show_milliseconds = false
min_time = 2000

# Lenguajes y herramientas
[python]
symbol = "🐍 "
format = 'via [$symbol$pyenv_prefix($version) ]($style)'
style = "bold yellow"

[nodejs]
symbol = "⬢ "
format = "via [$symbol($version )]($style)"
style = "bold green"

[rust]
symbol = "🦀 "
format = "via [$symbol($version )]($style)"
style = "bold red"

# Package version
[package]
format = "pkg [$version]($style) "
style = "bold magenta"
disabled = false

# AWS
[aws]
format = 'on [$symbol($profile )]($style)'
style = "bold blue"
symbol = "☁️  "

# Docker
[docker_context]
format = "via [$symbol$context]($style) "
style = "blue bold"
symbol = "🐳 "

# Kubernetes
[kubernetes]
format = 'on [⎈ $context\($namespace\)](bold purple) '
disabled = false

[kubernetes.context_aliases]
"arn:aws:eks:us-east-1:777555387664:cluster/lycsa" = "lycsa"

# Tiempo (opcional, descomenta si quieres ver la hora)
# [time]
# disabled = false
# format = '🕙[$time]($style) '
# time_format = "%R"
# style = "bold white"

# Configuración de estado de batería (para laptops)
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

# Variables de entorno
[env_var]
variable = "SHELL"
default = "unknown shell"
format = "with [$env_value]($style) "
disabled = true
