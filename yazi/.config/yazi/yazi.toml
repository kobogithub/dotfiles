#:schema https://yazi-rs.github.io/schemas/yazi.json
# Yazi — gestor de archivos en terminal (reemplazo de Finder).
# Lo que no se define aca hereda del preset de Yazi, asi que este archivo
# solo lleva las diferencias: layout, reglas de apertura y previews.
#
# Reglas clave: markdown/texto/codigo -> nvim (LazyVim); pdf/html -> Chrome.
# Atajos y teclas: ver keymap.toml. Colores: ver theme.toml.

[mgr]
ratio          = [ 1, 3, 4 ]   # mas ancho para el panel de preview
sort_by        = "natural"     # archivo2 antes que archivo10
sort_dir_first = true
show_hidden    = true          # este setup vive de dotfiles
linemode       = "size"
scrolloff      = 5

[preview]
wrap      = "yes"   # markdown y textos largos no se cortan a la derecha
max_width = 1000
max_height = 1400

# --- Openers -----------------------------------------------------------
# Se fusionan con los del preset (edit, open, play, reveal, extract).
[opener]
nvim = [
	{ run = 'nvim %s', desc = "Editar en nvim (LazyVim)", block = true },
]
chrome = [
	{ run = 'open -a "Google Chrome" %s', desc = "Abrir en Chrome", for = "macos", orphan = true },
	{ run = 'google-chrome-stable %s',    desc = "Abrir en Chrome", for = "linux", orphan = true },
]

# --- Reglas de apertura ------------------------------------------------
# prepend_rules tiene prioridad sobre las reglas del preset.
[open]
prepend_rules = [
	# Documentos que rinden mejor en el navegador
	{ mime = "application/pdf", use = [ "chrome", "open", "reveal" ] },
	{ mime = "text/html",       use = [ "chrome", "nvim", "reveal" ] },
	{ url = "*.{pdf,html,htm}", use = [ "chrome", "nvim", "reveal" ] },

	# Markdown y texto -> nvim
	{ url = "*.{md,mdx,markdown}", use = [ "nvim", "chrome", "reveal" ] },
	{ mime = "text/*",             use = [ "nvim", "open", "reveal" ] },

	# Codigo y configs -> nvim
	{ mime = "application/{json,ndjson,javascript,toml,x-yaml,yaml,x-sh}", use = [ "nvim", "reveal" ] },
	{ url = "*.{ts,tsx,js,jsx,py,go,rs,lua,sh,zsh,toml,yaml,yml,json,conf,ini}", use = [ "nvim", "reveal" ] },

	# Archivo vacio recien creado -> nvim
	{ mime = "inode/empty", use = [ "nvim", "reveal" ] },
]
